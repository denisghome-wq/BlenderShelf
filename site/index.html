<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BlenderShelf</title>
  <meta name="description" content="A Maya-shelf-style floating toolbar addon for Blender.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header>
    <nav class="wrap">
      <span class="brand">Blender<span class="brand-accent">Shelf</span></span>
      <button id="lang-toggle" type="button">EN</button>
    </nav>
  </header>

  <main>
    <section id="hero" class="wrap">
      <h1 data-ru="Панель инструментов в стиле Maya-shelf для Blender" data-en="A Maya-shelf-style toolbar for Blender">Панель инструментов в стиле Maya-shelf для Blender</h1>
      <p data-ru="Быстрый доступ к любимым инструментам прямо во вьюпорте." data-en="Quick access to your favorite tools right in the viewport.">Быстрый доступ к любимым инструментам прямо во вьюпорте.</p>
      <a href="#download" class="cta" data-ru="Скачать" data-en="Download">Скачать</a>
    </section>

    <section id="download" class="wrap">
      <h2 data-ru="Скачать" data-en="Download">Скачать</h2>
      <div class="panel">
        <div class="field">
          <label for="blender-version-select" data-ru="Моя версия Blender:" data-en="My Blender version:">Моя версия Blender:</label>
          <select id="blender-version-select"></select>
        </div>
        <div id="download-result"></div>
      </div>
      <p class="all-versions"><a href="https://github.com/denisghome-wq/BlenderShelf/releases" data-ru="Показать все версии" data-en="Show all versions">Показать все версии</a></p>
    </section>

    <section id="guide" class="wrap">
      <h2 data-ru="Видеогайд" data-en="Video guide">Видеогайд</h2>
      <div class="video-wrap">
        <iframe id="guide-video"
          data-src-ru="https://www.youtube.com/embed/REPLACE_WITH_RU_VIDEO_ID"
          data-src-en="https://www.youtube.com/embed/REPLACE_WITH_EN_VIDEO_ID"
          src="https://www.youtube.com/embed/REPLACE_WITH_RU_VIDEO_ID"
          title="BlenderShelf guide"
          allowfullscreen></iframe>
      </div>
      <a id="guide-pdf" class="cta cta-ghost"
        data-href-ru="guide/BlenderShelf_Guide_RU.pdf"
        data-href-en="guide/BlenderShelf_Guide_RU.pdf"
        href="guide/BlenderShelf_Guide_RU.pdf"
        data-ru="Скачать PDF-инструкцию"
        data-en="Download PDF guide (English translation coming soon)">Скачать PDF-инструкцию</a>
    </section>
  </main>

  <footer>
    <a href="https://github.com/denisghome-wq/BlenderShelf" class="footer-link">
      <svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
      <span data-ru="Исходный код на GitHub" data-en="Source code on GitHub">Исходный код на GitHub</span>
    </a>
  </footer>

  <script src="assets/logic.js"></script>
  <script src="assets/main.js"></script>
</body>
</html>
